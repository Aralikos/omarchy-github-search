name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile helper
        run: python -m py_compile github-search-helper.py

      - name: Unit and protocol tests
        run: python -m unittest discover -s tests -v

      - name: Manifest contract check
        run: python tests/check_manifest.py
